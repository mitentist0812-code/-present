<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>present!!</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f0e68c;
      margin: 0;
      padding: 40px 16px;
    }
    h1 {
      color: #8b4513;
    }
    button {
      padding: 12px 28px;
      font-size: 1rem;
      color: #fff;
      background-color: #e67e22;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: #d35400;
    }
    button:active {
      transform: scale(0.96);
    }
    dialog {
      width: min(90vw, 420px);
      padding: 24px;
      text-align: center;
      border: none;
      border-radius: 16px;
      background-color: #fffaf0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.55);
    }
    dialog img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 16px auto;
      border-radius: 8px;
      animation: taunt 0.6s ease-in-out infinite alternate;
    }
    #idiotDialog[open] {
      animation: pop-in 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #text {
      display: inline-block;
      animation: wiggle 0.5s ease-in-out infinite;
    }
    #message {
      animation: sway 1.2s ease-in-out infinite;
    }
    #closeIdiotDialog:hover {
      transform: rotate(-8deg) scale(1.1);
    }
    @keyframes pop-in {
      0% { transform: scale(0) rotate(-360deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-6deg) scale(1); }
      50% { transform: rotate(6deg) scale(1.15); }
    }
    @keyframes sway {
      0%, 100% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
    }
    @keyframes taunt {
      from { transform: translateY(0) rotate(-3deg); }
      to { transform: translateY(-8px) rotate(3deg); }
    }
  </style>
</head>
<body>

    <button type="button" id="closeIdiotDialog">閉じる</button>

  <script>
    const $ = (id) => document.getElementById(id);
    const presentDialog = $("presentDialog");
    const idiotDialog = $("idiotDialog");

    $("present").addEventListener("click", () => presentDialog.showModal());

    $("viewPresent").addEventListener("click", () => {
      presentDialog.close();
      idiotDialog.showModal();
    });

    $("closeIdiotDialog").addEventListener("click", () => {
      idiotDialog.close();
      $("text").textContent = "また会ったなばかめ！！";
      $("message").textContent = "閉じられるわけないだろう！";
      setTimeout(() => idiotDialog.showModal(), 500);
    });
  </script>
